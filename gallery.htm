<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
    }
  }
</script>


<script type="module">
  import * as THREE from "three";
  import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
  import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

    

    async function addSplat(containerId, url, x = 0, y = 0, z = 0) {
        const container = document.getElementById(containerId);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee);
        const camera = new THREE.PerspectiveCamera(75, container.offsetWidth / container.offsetHeight, 0.1, 1000);
        camera.position.set(0, 0, 0.1);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(container.offsetWidth, container.offsetHeight);
        container.appendChild(renderer.domElement);

        const spark = new SparkRenderer({ renderer });
        scene.add(spark);

        const splatURL = url;
        const splat = new SplatMesh({ url: splatURL });
        splat.quaternion.set(1, 0, 0, 0);
        splat.position.set(x, y, z);
        scene.add(splat);

        // Creating trackball control
        const trackball = new TrackballControls(camera, renderer.domElement);
        trackball.update();

        renderer.setAnimationLoop(function animate(time) {
            trackball.update();
            renderer.render(scene, camera);
            splat.rotation.y += 0.01;
        });
    }
    addSplat('sc1', './data/wheat_full.splat', 0, -0.5, -1);
    addSplat('sc2', './data/wheat_ms.splat', 0, -0.5, -1);
    addSplat('sc3', './data/wheat_ear.splat', 0, -0.5, -1);
    addSplat('sc4', './data/maize.splat', 0, -1, -2);
</script>
